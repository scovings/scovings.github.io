<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- LEFT RAIL -->
  <div class="rail">
    <div class="rail-brand">
      <h1>Recipe Box</h1>
      <div class="sub">your kitchen, kept</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search recipes or ingredients...">
    </div>
    <div class="tab-list" id="tabList"></div>
    <div class="rail-footer">
      <button class="btn-new" id="newRecipeBtn">+ New Recipe</button>
    </div>
  </div>

  <!-- MAIN STAGE -->
  <div class="stage">
    <div class="stage-inner" id="stageInner"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
